  # authors, journal, volume, pages, year); the record of what was and was not read is given per
  # entry. The closed form and the numerical optima were also reproduced independently in three
  # computer-algebra derivations before formalisation (exact arithmetic modulo x^3 - x - 1; a
  # closed-form derivation from the ladder constraints; a blind re-derivation over complex settings
  # with Sturm-exact uniqueness of the maximiser), held by the author and not shipped with this
  # entry. Literature search of
  # 2026-10-28: arXiv full texts (27 papers read or grepped), forward citations (OpenAlex: 201
  # works citing Boschi et al. 1997, Hardy 1997, Cabello 1998, Cereceda 2002, Cereceda 2016,
  # Meng et al. 2018, Yang et al. 2019 or Chen et al. 2024; the 96 with an arXiv copy grepped),
  # OEIS, and Google Scholar (its positive control on numeric strings failed, so its zero results
  # are weak evidence); prover sweep of the same day in the related_formalizations comment.
  # The id field carries the DOI and the citation; location carries the locator within the source.
  - title: "Nonlocality for two particles without inequalities for almost all entangled states"
    authors:
      - "Lucien Hardy"
    id: "https://doi.org/10.1103/PhysRevLett.71.1665; Physical Review Letters 71 (1993) 1665-1668"
    type: "article"
    # Crossref-verified 2026-10-28: title, author, journal, volume 71, pages 1665-1668, 13 Sep 1993.
    # Read in a primary copy on 2026-10-28: p. 1667 gives the maximum (1/2)(5 sqrt 5 - 11)
    # (approximately 9 %) at 2|alpha beta| = 3 - sqrt 5, for the settings constructed there.
    location: "p. 1667"
    relationship: "formalizes"
    note: >-
      Hardy's paradox for two spin-1/2 particles: for every non-maximally
      entangled pure state there are settings for which three joint
      probabilities vanish while a fourth is positive; p. 1667 gives the
      maximum (1/2)(5 sqrt 5 - 11) over states, attained at
      2|alpha beta| = 3 - sqrt 5, i.e. q + 1/q = phi^2. Statements 12-15
      formalise this value and its maximiser on q in (0, 1) (Hardy's
      condition is the quadratic factor q^2 - phi^2 q + 1 of statement 14's
      quartic); statements 1-2 at K = 1 formalise the optimality over all
      real settings at fixed state, which is Cereceda's (eq. (18) of the
      2002 paper; Cereceda 2002 credits the K = 1 case of its eq. (16), the
      probability as a function of the free setting, to Cereceda, Phys. Rev.
      A 57, 659, 1998, not opened).
      Statements 16-18 (ladder_K1_le, ladder_K1_attained,
      ladder_K1_hardy_condition_of_eq) give the optimum over every real
      Schmidt state and real settings, its attainment at a state with
      2 c0 c1 = 3 - sqrt 5, and Hardy's condition
      2 c0 c1 = 3 - sqrt 5 for every optimal configuration (statement 16 is
      a special case of Rabelo, Zhi and Scarani 2012, every dimension). The
      dimension-independence of the value (Rabelo, Zhi and Scarani 2012) is
      not formalised.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Ladder Proof of Nonlocality without Inequalities: Theoretical and Experimental Results"
    authors:
      - "D. Boschi"
      - "S. Branca"
      - "F. De Martini"
      - "L. Hardy"
    id: "https://doi.org/10.1103/PhysRevLett.79.2755; Physical Review Letters 79 (1997) 2755-2758"
    type: "article"
    # Crossref-verified 2026-10-28: title, four authors, journal, volume 79, pages 2755-2758,
    # 13 Oct 1997. The body was not opened (abstract only). The K-step ladder constraints are
    # taken from Cereceda 2002, which restates them; Cabello, Phys. Rev. A 58, 1687 (1998),
    # quotes 9.0 % at K = 1 from Hardy 1993 and 17.5 % at K = 2 from Hardy 1997 and Boschi et
    # al. 1997 (arXiv v2, p. 3), and Cereceda 2002, Table 1, computes 0.090 and 0.174 itself.
    location: "not opened"
    relationship: "formalizes"
    note: >-
      The K-step ladder (with Hardy 1997): the constraints
      P(A_0 = 1, B_0 = 1) = 0, P(A_{k+1} = 1, B_k = 0) = 0,
      P(A_k = 0, B_{k+1} = 1) = 0 (k < K) and the figure of merit
      P(A_K = 1, B_K = 1), with its optimum over two-qubit states (17.5 % at
      K = 2, as quoted by Cabello 1998; formalised here over real settings),
      and, with Hardy 1997, the ladder's approach to one half for large K
      ("the maximum value of P_K is (50 - delta)% which is realized for
      K -> infinity and a state that is not quite maximally entangled", as
      quoted by Cereceda 2002 after eq. (19)). Statements 1-2 formalise the
      closed form of the optimised probability at fixed state for every K
      (real Schmidt state, real settings) and its attainment; statement 4
      that 1/2 is approached as K grows, and statement 3 that the
      probability is below 1/2 for every K (for two qubits; Boschi et al.
      use equal settings, unequal real settings are Cereceda 2002, eq. (18),
      and the bound in every dimension follows from Cereceda 2016, eq. (9),
      with Wehner
      2006); statements 20-23 the K = 2 value on q in (0, 1),
      stated here in closed form; and statements 24-26 the K = 2 optimum
      over every real Schmidt state, its attainment and its optimal states.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Ladder proof of nonlocality for two spin-half particles revisited"
    authors:
      - "José L. Cereceda"
    id: "https://doi.org/10.1088/0305-4470/35/43/309; Journal of Physics A: Mathematical and General 35 (2002) 9105-9111; arXiv:quant-ph/0206015"
    type: "article"
    # Crossref-verified 2026-10-28: title, author, journal, volume 35, pages 9105-9111, 15 Oct 2002.
    # Read in full (arXiv v4, the journal version) on 2026-10-28: eqs. (6)-(20), (33), Table 1
    # (K = 1, ..., 10, three decimals; at K = 2: r1 = 0.569, r2 = 1.754, P_K^max = 0.174; 0.17455
    # appears as 0.174), the symmetry remark below Table 1 (p. 4) and the footnote to eq. (20).
    # The sentence after eq. (19) (p. 3) quoted for statements 3-4 was re-read verbatim from
    # the arXiv v4 PDF on 2026-10-28.
    location: "eqs. (6)-(9), (18)-(20), (33); Table 1; pp. 3, 4 and 6 of arXiv v4: p. 3 after eq. (19); p. 4 below Table 1 and footnote; p. 6"
    relationship: "formalizes"
    note: >-
      Proves that the K-step two-qubit ladder probability is maximised over
      the free setting by equal A and B settings (eq. (18)) and gives the
      optimised probability at fixed Schmidt ratio in closed form, eq. (19),
      equivalently half of eq. (33) in x = alpha/beta (attributed there to
      Hardy 1997 and Boschi et al. 1997, as is the remark that follows it:
      "the maximum value of P_K is (50 - delta)% which is realized for
      K -> infinity and a state that is not quite maximally entangled",
      formalised as statement 4 and, for two qubits, statement 3); p. 6
      puts the maximum violation S_K = 2 P_K -> 1 at K -> infinity and
      x -> 1; notes the symmetry P_K(alpha, beta) = P_K(beta, alpha)
      (p. 4); characterises the maximisers r1 and r2 = 1/r1 as the
      non-trivial real roots of
      m_K(x) = x^{4K+3} - (1+2K) x^{2K+3} - 2K x^{2K+2} - 2K x^{2K+1}
      - (1+2K) x^{2K} + 1 (eq. (20); "It can be shown", p. 4, without
      proof; one root r1 < 1 < r2: cited for statements 6-8 and the
      uniqueness statements 15 and 23); and tabulates r1, r2 and the maxima numerically for
      K = 1, ..., 10 (Table 1: 0.090 at K = 1, 0.174 at K = 2; 0.17455
      appears as 0.174). Statements 1-2 formalise eq. (19) as a bound and its
      attainment for every K, with eq. (18) for unequal real settings;
      statements 5-8 formalise the characterisation of eq. (20) on (0, 1)
      for every K >= 1 (the m_K written out there is eq. (20) coefficient for
      coefficient; Cereceda's variable is x = alpha/beta and ours q = c1/c0,
      and m_K is palindromic, x^{4K+3} m_K(1/x) = m_K(x), so both readings
      have the same zeros), with the derivative identity behind it
      (statement 5), and statements 9-11 the resulting optimum over every
      real Schmidt state; statements 12-15 and 20-23 give the K = 1 and
      K = 2 maxima on (0, 1) in closed form (phi^{-5};
      (8 rho^2 + rho - 11)/25 with the maximiser rho^{-2}). Over Q,
      m_1(x) = (x + 1)^3 (x^4 - 3x^3 + 3x^2 - 3x + 1),
      whose quartic factor is statement 14's, and
      m_2(x) = (x + 1)^3 (x^2 + 1)(x^3 - 2x^2 + x - 1)(x^3 - x^2 + 2x - 1),
      whose last factor is statement 22's cubic and whose cubic
      x^3 - 2x^2 + x - 1 is the minimal polynomial of rho^2 (Cereceda's
      r2 = 1.754, truncated; rho^2 = 1.75488...); the
      paper does not factor m_2 beyond noting the triple root -1 and that
      the other 4K - 2 roots are complex (footnote, p. 4), and the root
      rho^{-2}, the value in Q(rho) and the Schmidt weights are not stated
      in it (the factorisations are the library lemmas
      HardyLadder.cerecedaM_one and HardyLadder.cerecedaM_two). The library
      proves the symmetry as HardyLadder.ladderValue_inv (uncompared); it
      enters the proofs of statements 3, 9, 11, 16, 18, 24 and 26 (the
      attainment statements 10, 17 and 25 do not use it).
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Device-Independent Bounds for Hardy's Experiment"
