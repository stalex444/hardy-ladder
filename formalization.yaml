  - title: "The two-step (K = 2) two-qubit Hardy ladder optimum in closed form: maximiser q = rho^{-2}, value (8 rho^2 + rho - 11)/25 with minimal polynomial 25x^3 + 17x^2 + 2x - 1, optimal Schmidt weights {rho^{-1}, rho^{-5}}"
    authors:
      - "Stephanie Alexander"
    id: "this repository: statements 20-22 and 24-30 of Challenge.lean"
    type: "this formalization"
    location: "HardyLadder/HardyK2.lean, HardyLadder/Minpoly.lean, HardyLadder/Optimum.lean, HardyLadder/TotallyReal.lean"
    relationship: "other"
    note: >-
      The closed forms are presented in this repository; they were not found
      in the literature and repositories searched (search dated 2026-10-28;
      a search result, not a proof of absence; the bodies of Hardy 1997 and
      Boschi et al. 1997 were not opened). In print: the numerical value
      (17.5 % quoted by Cabello 1998 from Hardy 1997 and Boschi et al. 1997;
      0.174 in Cereceda 2002, Table 1, where 0.17455 appears as 0.174;
      0.17455 in Meng et al. 2018, Table I; 0.174550 in Cereceda 2017,
      Table 1, and in Yang, Zhang and Chen 2024, Table I) and the maximiser r1 = 0.569 (Cereceda 2002, Table 1), a root
      of m_2(x) (eq. (20)); the root 0.5698... itself is OEIS A357471, which
      mentions neither the plastic number nor Hardy's ladder. The uniqueness
      of the maximiser (statement 23, and statements 6-8 for every K) is
      stated in Cereceda 2002, p. 4 ("It can be shown"), without proof, and
      is credited there; no printed proof of it for K >= 2 was found in the
      literature searched (search dated 2026-10-29: Cereceda 2002, 2015,
      2016 and 2017; Meng et al. 2018; Yang et al. 2019; Yang, Zhang and
      Chen 2024; Chen, Mal, Tabia and Liang 2024; Barbieri, De Martini, Di
      Nepi and Mataloni 2004, arXiv:quant-ph/0406156; Cabello 1998; none
      prints a proof; where they treat K >= 2 they state the characterisation
      (Cereceda 2002) or the existence of a maximiser without proof, or give
      numerical values; the bodies of Hardy 1997 and Boschi
      et al. 1997 were not opened), so the proof of statements 5-8 given
      here (the derivative identity and m_K = 1 - x^{2K} g_K with g_K and
      g_K' positive on [0, 1]) is presented in this repository; the
      statement is Cereceda's. That the value is not totally real
      (statement 30) is an elementary consequence of statement 27: the cubic
      has discriminant -23^3 < 0, so one real root.
    license: "MIT"
    author_endorsement: "participated"

related_formalizations:
  # Prover sweep of 2026-10-28 (HEADs of the day): Mathlib master and the pin, QuAIR/Lean-QIT,
  # physical-superintelligence/oqp-batch-2026, openai/math, leanprover-community/physlib,
  # Timeroot/Lean-QuantumInfo, coq-quantum/CoqQ, inQWIRE/QuantumLib, Isabelle/AFP, and a
  # GitHub-wide code search for Hardy's paradox and the Hardy ladder (Lean, Coq, Isabelle). It
  # found the three Lean formalisations of Hardy's K = 1 paradox listed below and no formal
  # statement of the ladder bound, of the K = 1 maximality or uniqueness, or of anything at K = 2.
  # A second sweep on 2026-10-29, at that day's heads of the same targets (openai/math and the AFP
  # through their contents lists, tree listings and code search) and adding the Lean library
  # the-omega-institute/trureturing, found no formal statement of statements 5-11 or 30. That
  # library (dev 52ce13dc, 2026-10-29) has Hardy-type modules on other arguments: the temporal
  # Hardy maximum 1/4 with spin measurements
  # (D5/S3/Quantum/Contextuality/TemporalHardySpinAttainment.lean), a refuted no-signalling
  # conjecture for a relaxed multipartite Hardy test, and a refutation of the three-qubit 9/64
  # conjecture of Cereceda 2017 (D5/S3/Quantum/Entanglement/ThreeQubitCabelloRefutation.lean);
  # none concerns the two-qubit ladder or Cereceda 2002.
  # The nearest formal neighbours are CHSH/Tsirelson developments (Mathlib
  # Mathlib/Algebra/Star/CHSH.lean, Lean-QIT QIT/Nonlocality/Tsirelson.lean, AFP
  # Projective_Measurements/CHSH_Inequality.thy and the AFP entry TsirelsonBound (Tsirelson.thy),
  # and CoqQ src/QIT/commutator.v (CHSH_inequality, CHSH_violation)); none states a Hardy or
  # ladder bound.
  - id: "Mathlib Mathlib/NumberTheory/Real/GoldenRatio.lean (Real.goldenRatio)"
    relationship: "builds-on"
    note: >-
      The K = 1 value is stated as phi^{-5} with Mathlib's golden ratio
      phi = (1 + sqrt 5)/2 (Real.goldenRatio, file authors Anatole Dedecker,
      Alexey Soloyev, Junyan Xu and Kamila Szewczyk; quoted in
      MATHLIB_DEFINITIONS.md); statement 13 identifies it with
      (5 sqrt 5 - 11)/2. The facts about it used are its definition,
      phi^2 = phi + 1 (Real.goldenRatio_sq), 0 < phi (Real.goldenRatio_pos),
      1 < phi (Real.one_lt_goldenRatio), phi < 2 (Real.goldenRatio_lt_two)
      and phi /= 0 (Real.goldenRatio_ne_zero).
  - id: "Mathlib Mathlib/FieldTheory/Minpoly/Basic.lean (minpoly), Mathlib/FieldTheory/Minpoly/Field.lean (minpoly.eq_of_irreducible_of_monic) and Mathlib/FieldTheory/IntermediateField/Adjoin (adjoin, adjoin.finrank)"
    relationship: "builds-on"
    note: >-
      Statements 27-30 are stated with Mathlib's minimal polynomial (and
      statement 28 with intermediate fields); the proofs use
      minpoly.eq_of_irreducible_of_monic, Gauss's lemma
      (Monic.irreducible_iff_irreducible_map_fraction_map), reduction modulo
      2 (Monic.irreducible_of_irreducible_map), and for statement 30 the
      count of roots of a separable polynomial in an algebraically closed
      field (card_rootSet_eq_natDegree, with Irreducible.separable).
  - id: "Mathlib Mathlib/NumberTheory/NumberField/InfinitePlace/TotallyRealComplex.lean (NumberField.IsTotallyReal) and InfinitePlace/Embeddings.lean (range_eval_eq_rootSet_minpoly)"
    relationship: "builds-on"
    note: >-
      The uncompared library lemmas HardyLadder.totallyReal_subfield_eq_bot
      and HardyLadder.mem_bot_of_isTotallyReal_adjoin (every totally real
      subfield of a number field of degree 3 containing a root of
      x^3 - x - 1 is Q) are stated with Mathlib's IsTotallyReal (every
      infinite place real) and proved through the correspondence between
      embeddings into C and roots of the minimal polynomial, the count of
      roots of a separable polynomial in an algebraically closed field
      (card_rootSet_eq_natDegree), and
      IntermediateField.isSimpleOrder_of_finrank_prime.
  - id: "Mathlib Mathlib/Analysis/Calculus/Deriv (HasDerivAt and its algebra), Mathlib/Analysis/Calculus/Deriv/MeanValue.lean (strictMonoOn_of_deriv_pos, strictAntiOn_of_deriv_neg) and Mathlib/Topology/Order/IntermediateValue.lean (intermediate_value_Ioo')"
    relationship: "builds-on"
    note: >-
      Statement 5 is stated with Mathlib's HasDerivAt and proved by
      composing hasDerivAt_pow, HasDerivAt.fun_mul, fun_add, fun_sub, fun_pow
      and fun_div; statements 6-8 use strictMonoOn_of_deriv_pos and
      strictAntiOn_of_deriv_neg on [0, 1], (0, r] and [r, 1), and the
      intermediate value theorem intermediate_value_Ioo' for the zero of
      m_K.
  - id: "https://github.com/zblore/csd-lean4/blob/1aa340c28dae7817b10d0db47d05190613c38aee/CsdLean4/Empirical/QM/Hardy.lean"
    relationship: "independent"
    note: >-
      Prior Lean 4 formalisation of Hardy's K = 1 paradox: the local-realism
      no-go (CSD.Empirical.Hardy.no_lhv_hardy), realisations with probability
      1/12 and with the golden-ratio state, and attainment of the value
      (CSD.Empirical.Hardy.HardyQMMax.hardyMax_probability_eq: probability
      (5 sqrt 5 - 11)/2; hardyMax_value: 1/(5 phi + 3) = (5 sqrt 5 - 11)/2).
      It states no upper bound (hardyMax_probability_eq evaluates the
      probability at the golden-ratio state, which the repository's prose
      calls the maximum), and nothing on uniqueness, the ladder bound or
      K = 2; statements 1-11, the upper-bound half
      of 12, 14-16 and 18-30 here are not in it (statement 17, the attainment
      of the K = 1 value, overlaps hardyMax_probability_eq, as does the
      attainment half of 12). At HEAD 329276a5 (2026-10-28) no Hardy file had
      changed; the repository also has CsdLean4/Empirical/CSD/HardyVolume.lean
      (hardy_max_volume_probability: the same value as a Kähler volume, an
      evaluation), CsdLean4/Empirical/CSD/Hardy.lean (no_csd_hardy_assignment,
      a CSD-model no-go), CsdLean4/LF4/HardyKahler.lean (Born-frequency
      convergence for the 1/12 state, hardy_freq_convergence) and
      CsdLean4/Mathlib/Probability/ChainedBell.lean (the
      Colbeck-Renner chained walk; a no-signalling marginal bound; not the
      ladder, and not the Braunstein-Caves inequality).
  - id: "https://github.com/primaryhosting/brockian-mathematics/tree/29426ff65b6f1fd68d594e529632eb79b5be3089/aristotle/mined_lemmas/QI_hardy_paradox"
    relationship: "independent"
    note: >-
      Lean 4 files (headers: "Verification: pending") for Hardy's K = 1
      paradox: the local-realism no-go (QI.hardy_paradox, QI.hardy_paradox_measure,
      QI.lhv_hardy_zero) and the probability 1/12 (QI.hardy_pos_A0_B0, for
      the state (|00> + |01> + |10> - 3|11>)/sqrt 12; the docstring of
      QI.hardy_paradox uses |00> + |01> + |10>). No optimum, no ladder.
  - id: "https://github.com/inventor1975/ZTL/blob/77a6890e871def3cb13f9e7114e4bd9dd926fdd3/lean/Hardy.lean"
    relationship: "independent"
    note: >-
      Self-contained Lean 4 file (no Mathlib) checking the 1/12 instance of
      Hardy's K = 1 paradox in integer arithmetic (Hardy.contested_occurs,
      Hardy.certainties). No optimum, no ladder.

status:
  scope: >-
    Formalized, thirty compared theorems in namespace HardyLadder.Entry
    (Challenge.lean, proved in Solution.lean by the library HardyLadder).
    Statements 1-2 model the ladder for a real two-qubit state in Schmidt
    form with real projective settings, the probabilities written out as
    squared real amplitudes: ladder_prob_le gives, for c0, c1 > 0 with
    c0^2 + c1^2 = 1 and angles a b : N -> R satisfying the K-step ladder
    constraints (stated as vanishing squared amplitudes),
    (c0 cos a_K cos b_K + c1 sin a_K sin b_K)^2 <= P_K*(c1/c0);
    ladder_prob_attained gives angles satisfying the constraints with
    equality. Statements 3-4, every K, in the same setting:
    ladder_prob_lt_half gives, under exactly the hypotheses of
    ladder_prob_le, (c0 cos a_K cos b_K + c1 sin a_K sin b_K)^2 < 1/2;
    ladder_prob_approaches_half gives, for every eps > 0, some K0 : N such
    that for every K >= K0 there are c0, c1 > 0 with c0^2 + c1^2 = 1 and
    angles a b : N -> R satisfying the K-step constraints with
    1/2 - eps < (c0 cos a_K cos b_K + c1 sin a_K sin b_K)^2. Statements
    5-11, every K, with Cereceda's
    m_K(x) = x^{4K+3} - (1 + 2K) x^{2K+3} - 2K x^{2K+2} - 2K x^{2K+1}
    - (1 + 2K) x^{2K} + 1 written out in 5-9 and 11 (K cast to R in the
    coefficients):
    hasDerivAt_ladder_value is, for q > 0, HasDerivAt P_K*
    (2q (1 - q^{2K}) m_K(q) / ((1 + q^2)^2 (1 + q^{2K+1})^3)) q;
    existsUnique_mK_root is, for K >= 1, the existence and uniqueness of
    r in (0, 1) with m_K(r) = 0; for K >= 1 and such r,
    ladder_value_isGreatest_of_mK_root is IsGreatest (P_K* '' Ioo 0 1)
    (P_K*(r)), eq_of_ladder_value_eq_of_mK_root gives q = r for every
    q in (0, 1) with P_K*(q) = P_K*(r), ladder_prob_le_of_mK_root is the
    bound (c0 cos a_K cos b_K + c1 sin a_K sin b_K)^2 <= P_K*(r) under the
    K-step constraints for every Schmidt state (either order of c0, c1),
    and ratio_of_ladder_prob_eq_of_mK_root gives c1/c0 = r or
    c1/c0 = r^{-1} whenever it is attained; ladder_prob_attained_of_ratio
    gives, for every K and r > 0, c0, c1 with c1/c0 = r and angles
    satisfying the K-step constraints with the squared amplitude equal to
    P_K*(r). Statements 12-18 (K = 1): hardy_K1_isGreatest is
    IsGreatest (P_1* '' Ioo 0 1) (phi^{-1} ^ 5); hardy_value_eq is
    phi^{-1} ^ 5 = (5 sqrt 5 - 11)/2; hardy_K1_eq_iff_quartic is, for
    q in (0, 1), P_1*(q) = phi^{-5} iff q^4 - 3q^3 + 3q^2 - 3q + 1 = 0;
    hardy_K1_existsUnique is the uniqueness of the maximiser; ladder_K1_le
    is the bound (c0 cos a_1 cos b_1 + c1 sin a_1 sin b_1)^2 <= phi^{-1} ^ 5
    under the one-step constraints for every Schmidt state;
    ladder_K1_attained gives c0, c1 with 2 c0 c1 = 3 - sqrt 5 and angles
    attaining it; ladder_K1_hardy_condition_of_eq gives
    2 c0 c1 = 3 - sqrt 5 whenever it is attained. Statements 19-26
    (K = 2): existsUnique_cubic is the existence and uniqueness of a real
    rho with rho^3 = rho + 1; the remaining seven take such a rho as a
    hypothesis: hardy_K2_isGreatest is
    IsGreatest (P_2* '' Ioo 0 1) ((8 rho^2 + rho - 11)/25);
    hardy_K2_eq_iff_inv_sq is, for q in (0, 1), P_2*(q) = that value iff
    q = rho^{-1} ^ 2; hardy_K2_eq_iff_cubic is the same iff
    q^3 - q^2 + 2q - 1 = 0; hardy_K2_existsUnique the uniqueness of the
    maximiser; ladder_K2_le is the bound (8 rho^2 + rho - 11)/25 under the
    two-step constraints for every Schmidt state; ladder_K2_attained gives
    c0, c1 with c0^2 = rho^{-1}, c1^2 = rho^{-1} ^ 5 and angles attaining
    it; ladder_K2_weights_of_eq gives (c0^2 = rho^{-1} and
    c1^2 = rho^{-1} ^ 5) or (c0^2 = rho^{-1} ^ 5 and c1^2 = rho^{-1})
    whenever it is attained. Statements 27-30: minpoly_value is
    minpoly Q ((8 rho^2 + rho - 11)/25) =
    X^3 + C (17/25) X^2 + C (2/25) X - C (1/25); finrank_adjoin_value is
    Module.finrank Q (IntermediateField.adjoin Q {(8 rho^2 + rho - 11)/25}) = 3;
    irreducible_25 is Irreducible (25 X^3 + 17 X^2 + 2 X - 1 : Q[X]);
    exists_nonreal_root_minpoly_value gives z : C with z.im /= 0 and
    aeval z (minpoly Q ((8 rho^2 + rho - 11)/25)) = 0 (read with
    statement 27, which identifies that polynomial as the monic cubic: the
    value is not totally real). Given statements 12 and 20, statements
    14-15 and 22-23 follow from the K = 1 and K = 2 cases of statements 6-8
    through the factorisations of m_1 and m_2 (library lemmas
    cerecedaM_one, cerecedaM_two; the other factors have no zero in
    (0, 1)), and statement 23 also follows directly from statement 21,
    since rho^{-2} is in (0, 1); they are proved separately.
    No physical claim is part of the compared statements: they assert
    inequalities, identities and a derivative of real expressions and
    facts about a polynomial over Q and a cubic number field. The library
    also proves, uncompared: the symmetry P_K*(1/q) = P_K*(q) and
    P_K*(1) = 0; the limit P_K*(q) -> q^2/(1 + q^2) as K -> infinity for
    fixed q in (0, 1); m_K(x) = 1 - x^{2K} g_K(x) with g_K and g_K'
    positive on [0, 1], and the factorisations of m_1 and m_2; that every
    totally real subfield of a number field of degree 3 containing a root
    of x^3 - x - 1 is Q (some embedding sends that root off the real line);
    rho^{-1} + rho^{-5} = 1; the bounds 5/4 < rho < 4/3; the symmetric form
    of the closed form in c0, c1; the one-variable bounds in s = q + 1/q;
    the factorisations of the K = 1 quartic over Q(phi) and of the K = 2
    cofactor over Q(rho); and the irreducibility of x^3 - 2x^2 - 17x - 25
    over Z.
