  - title: "Chained Clauser-Horne-Shimony-Holt inequality for Hardy's ladder test of nonlocality"
    authors:
      - "José Luis Cereceda"
    id: "https://doi.org/10.1007/s11128-015-1217-4; Quantum Information Processing 15 (2016) 1779-1792; arXiv:1508.06317"
    type: "article"
    # Crossref-verified 2026-10-28: title, author, journal, volume 15, pages 1779-1792, Apr 2016.
    # arXiv v1 read: eqs. (8)-(9) (p. 3) and p. 4.
    location: "eqs. (8)-(9); p. 4 (arXiv v1)"
    relationship: "independently-proves"
    note: >-
      Scoped to statement 3. Proves from no-signalling alone that the
      ladder constraints give CHSH_K = 2K + 4 P_K (eq. (8)), and with
      Wehner's chained-CHSH Tsirelson bound (any state, +-1 observables) the
      upper limit P_K <= L_K = (1/4)[2(K+1) cos(pi/(2(K+1))) - 2K]
      (eq. (9)), with L_K -> 0.5. Cereceda states his setting as two
      qubits; the following are inferences drawn here, not his words: since
      the cosine is below 1, L_K < 1/2 for every K, and since neither step
      uses the dimension, the strict bound of statement 3 holds in every
      dimension for +-1 observables. Statement 3 is the two-qubit,
      real-settings, Schmidt-form case, proved here from the
      closed form of statement 1, not through the chained-CHSH bound. At
      K = 2, L_2 = (3 sqrt 3 - 4)/4, about 0.299, which is not tight. Its
      p. 4 also states the two-qubit limit 0.5, "realized for K -> infinity
      and a state that is close to maximally entangled (x -> 1) [3, 4]"
      (cited for statement 4), and prints the q-form of the closed form,
      P_K(x) = x^2/(1 + x^2) ((1 - x^{2K})/(1 + x^{2K+1}))^2. Nothing beyond
      two qubits is formalised here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Tsirelson bounds for generalized Clauser-Horne-Shimony-Holt inequalities"
