fidelity:
  divergences: >-
    The ladder is stated for a real two-qubit state in Schmidt form and real
    settings only: measurement directions are (cos a_k, sin a_k) and
    (-sin a_k, cos a_k) in the Schmidt basis, with the angles as functions
    a b : N -> R of which only indices 0..K are used, and the state is
    c0|00> + c1|11> with c0, c1 > 0. The reduction of a general two-qubit
    pure state with complex settings to this case (local unitaries absorbed
    into the settings, and the cancellation of the measurement phases) is
    not formalised here and is not part of this entry; Cereceda 2002 also
    works with real settings. A numerical optimisation over complex states
    and complex projective settings (200 random restarts for each of
    K = 1, 2, 3; not shipped) found the same optima - numerical evidence,
    not proof. Mixed states and general POVMs are not
    addressed. The state, the measurements and the probabilities are not
    Hilbert-space objects in the statements: the ladder constraints are
    vanishing squared real amplitudes and the objective is the squared
    amplitude P(A_K = 1, B_K = 1); the identification of these expressions
    with quantum-mechanical probabilities is the informal reading, not part
    of the statements. The state c0|00> + c1|11> differs from Cereceda's
    alpha|++> - beta|--> by a local sign (b -> -b), which leaves the optima
    unchanged; Cereceda's optimal alpha_k = beta_k becomes b_k = -a_k here,
    the witness of statement 2 (tan b_k = -tan a_k for every k). Statements
    1-2 take q = c1/c0 inside the formula rather than naming P_K* (the
    q-form is half of Cereceda's eq. (33); his eq. (19) is the
    (alpha, beta) form, the library's uncompared ladderValue'); at K = 0
    both sides of statements 1-2 are 0, statement 3 at K = 0 reads
    0 < 1/2, and statement 5 at K = 0 says that the zero function has
    derivative 0; statements 6-9 and 11 assume K >= 1. Statements 6-8, 12,
    14-15 and 20-23 concern P_K*(q) (and m_K) on q in (0, 1), i.e. states
    with c1 < c0 (statement 5 holds for every q > 0; statements 13 and 19
    are about phi and rho alone); the passage to every Schmidt
    ratio uses the symmetry P_K*(1/q) = P_K*(q) (Cereceda 2002, below
    Table 1; p. 4 of arXiv v4), which is proved in the library
    (HardyLadder.ladderValue_inv, uncompared) and enters the proofs of the
    compared statements 3, 9, 11, 16, 18, 24 and 26; with the attainment
    statements 10, 17 and 25 these cover every Schmidt ratio (c1 < c0,
    c1 = c0 or c1 > c0; product states, c0 = 0 or c1 = 0, are excluded by
    the hypotheses c0, c1 > 0 as in statements 1-2). Attainment is stated
    at one optimal state: for every K at the ratio r (statement 10), at
    K = 1, 2 at one state (statements 17, 25); that the swapped state,
    ratio r^{-1}, also attains the optimum follows from the symmetry and
    is not a compared statement. Statements 9 and 11 are statement 1
    composed with the library proofs of 7-8 and the symmetry, for every
    K >= 1, with r a hypothesis (r in (0, 1), m_K(r) = 0) whose existence
    and uniqueness is statement 6; statement 10 is statement 2 at the
    state c0 = (1 + r^2)^{-1/2}, c1 = r c0, for every K and every r > 0,
    and does not need m_K(r) = 0 (at the zero of m_K it attains the bound
    of statement 9).
    Statements 16-18 and 24-26 are statements 1-2 composed with the library
    proofs of 12, 20 and 21, the symmetry (in 16, 18, 24 and 26), Hardy's quadratic
    q^2 - phi^2 q + 1 (for 17-18) and rho^{-1} + rho^{-5} = 1 (for 25-26,
    the uncompared library lemma HardyLadder.inv_add_inv_pow_five),
    written out at K = 1 and K = 2 (the constraints as "for all k < 1" and
    "for all k < 2", the objective at index 1 and 2); their text is
    identical to the library theorems of HardyLadder/Optimum.lean that
    prove them. The
    statement "the supremum over all K, all Schmidt states and all real
    settings is 1/2 and is not attained" is not a single Lean statement: it
    is split into statement 3 (strict bound, every K) and statement 4
    (for every eps > 0 there is K0 such that every K >= K0 admits a state
    and settings above 1/2 - eps), and no sSup, limit or filter is written
    in statements 3-4 (the one limit notion in the compared set is
    HasDerivAt, in statement 5). In statement 4 the state is quantified
    after K, so it may depend on eps and K; the proof uses one state for
    each eps (its Schmidt ratio q = c1/c0 taken close to 1, so the state is
    entangled but not maximally, as in Cereceda's quotation) and varies only
    the angles with K. Nothing is claimed about the rate at which 1/2 is
    approached. Statements 5 and 7-11 write P_K* out, and statements 5-9 and 11
    Cereceda's m_K, for a
    variable K : N, which enters the exponents as a natural number and the
    coefficients 1 + 2K and 2K as a real number (the library states them
    through ladderValue K q and cerecedaM K x, which unfold to the
    written-out formulas). Statements 12, 14, 15 and 20-23 write P_1* and
    P_2* out with the exponents 2, 3 and 4, 5, which are the instances
    2K, 2K + 1 of the general formula at K = 1, 2 (the library states them
    through the definition ladderValue K q, which unfolds to the
    written-out formula). The plastic number enters
    statements 20-30 as a real number rho with the hypothesis
    rho ^ 3 = rho + 1; statement 19 proves that exactly one such real
    number exists, so the hypothesis determines rho. Statement 29 carries
    the hypothesis rho ^ 3 = rho + 1, which does not enter its conclusion:
    the proof goes through the minimal polynomial of the value (statement
    27), and the statement is kept in the form of statements 27-28; by
    statement 19 the hypothesis is satisfiable, so the statement is not
    vacuous. Statement 27 gives the minimal polynomial in Mathlib's monic
    form over Q; its primitive integer form 25x^3 + 17x^2 + 2x - 1 is
    statement 29 (over Q; the library proves the reversed polynomial
    x^3 - 2x^2 - 17x - 25 irreducible over Z and over Q, uncompared). The
    K = 2 value is the optimum over two-qubit Schmidt states and real
    settings, and the bound 1/2 of statements 3-4 is likewise stated over
    two-qubit Schmidt states and real settings; nothing is claimed about
    higher dimensions (the dimension-independence at K = 1 is Rabelo, Zhi
    and Scarani 2012, and the strict bound P_K < 1/2 in every dimension
    follows from Cereceda 2016, eq. (9), with Wehner 2006; neither is
    formalised). The derivative appears in statement 5 only, as Mathlib's
    HasDerivAt at each q > 0; Cereceda's characterisation of the maximisers
    is formalised on (0, 1) for every K >= 1 as statements 6-8 (the zero r
    of m_K in (0, 1) exists, is unique, and is the unique maximiser), with
    no second-derivative or critical-point classification stated (the
    proof uses the sign of m_K on either side of r); the root r2 = 1/r1 > 1
    enters only through the symmetry, in statement 11. Cereceda's footnote
    census of the other roots of m_K (-1 with multiplicity 3, 4K - 2
    non-real roots) and his remark that r1 -> 1 as K -> infinity are not
    formalised (the census was checked by computer algebra for K <= 40). At K = 1, 2 the
    maximisers are also characterised algebraically (statements 14, 21,
    22) and by uniqueness (statements 15, 23); the word "stationarity
    cofactor" for q^3 - q^2 + 2q - 1 refers to its being the factor of
    m_2 carrying the zero in (0, 1) (library lemma cerecedaM_two; the
    factorisation is not a compared statement). Statement 30 renders "the
    K = 2 value is not totally real" as: the minimal polynomial of the
    value over Q has a root z in C with z.im /= 0, a non-real conjugate;
    Mathlib's minpoly is 0 for a non-algebraic element, for which the
    conclusion would hold trivially; the value is algebraic of degree 3 and
    statement 27 identifies the polynomial as the monic cubic, so z is a
    conjugate of the value (a root of 25x^3 + 17x^2 + 2x - 1), and the two
    statements together say that the value is not totally real.
    Mathlib's NumberField.IsTotallyReal is not used in it, and the reading
    of the complex roots of the minimal polynomial as the conjugates is
    the standard meaning of the word, not a compared theorem. That
    Q((8 rho^2 + rho - 11)/25) = Q(rho), which follows from statement 28
    (v lies in Q(rho), and both have degree 3), is not formalised. The
    library keeps, uncompared, the field form: every totally real subfield
    of a number field of degree 3 containing a root of x^3 - x - 1 is Q
    (HardyLadder.totallyReal_subfield_eq_bot,
    HardyLadder.mem_bot_of_isTotallyReal_adjoin).

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    Self-assessed; not peer-reviewed. Before submission the author had the
    entry read in AI-assisted in-house reviews: presentation, provenance
    and literature account; fidelity of the Lean statements, with a
    rebuild, an axiom audit and an elaborated-type comparison of Challenge
    and Solution; and prior art in the literature and the formal
    libraries. The most recent review, on 2026-10-29, covered all thirty
    statements. The findings of the most recent review were applied as
    text and metadata edits; no compared statement changed in response to
    it. Every
    compared statement is kernel-checked, axiom-audited and accepted by
    lake comparator (BUILD.txt). Every DOI was checked against Crossref,
    and quotations against the primary texts named in each source entry.

alignment:
  namespace: "HardyLadder.Entry"
  statements:
    - source: "Cereceda 2002, eq. (19), equivalently half of eq. (33) in x = alpha/beta (attributed there to Hardy 1997 and Boschi et al. 1997; optimality over the settings at fixed state: Cereceda 2002, eq. (18)): the K-step two-qubit ladder probability optimised over the free setting at fixed Schmidt ratio; formalised as an upper bound for a real Schmidt state and real settings (no prior formal statement found, prover sweep dated 2026-10-28)"
      lean: "HardyLadder.Entry.ladder_prob_le"
      module: "Solution"
      status: "proved"
      note: >-
        For c0, c1 > 0 with c0^2 + c1^2 = 1 and angles satisfying the K-step
        ladder constraints, (c0 cos a_K cos b_K + c1 sin a_K sin b_K)^2 <=
        q^2 (1 - q^{2K})^2 / ((1 + q^2)(1 + q^{2K+1})^2) with q = c1/c0.
        Proof: each constraint makes a unit vector parallel to a rotated
        image of the previous one, so A_K and B_K are parallel to N^K A_0 and
        N^K J M A_0 (N = diag(c1, c0), J M = [[0, -c1], [c0, 0]]), in an
        order depending on the parity of K; the squared amplitude is then a
        ratio whose denominator exceeds the AM-GM value by
        c0^{2K} c1^{2K} (c0 x^2 - c1 y^2)^2 >= 0 for A_0 = (x, y).
    - source: "Cereceda 2002, eq. (19) and the equal-settings optimum, eq. (18) (the attainment of the closed form); Hardy 1997; Boschi et al. 1997"
      lean: "HardyLadder.Entry.ladder_prob_attained"
      module: "Solution"
      status: "proved"
      note: >-
        For every K and every normalised c0, c1 > 0 there are angles
        satisfying the constraints with equality: tan a_0 = q^{-1/2},
        tan b_0 = -q^{-1/2}, tan a_{k+1} = tan b_k / q, tan b_{k+1} = tan a_k / q,
        realised with Real.arctan. (Cereceda's alpha_k = beta_k is for the
        state alpha|++> - beta|-->; for c0|00> + c1|11> this is b_k = -a_k,
        the witness used here.)
    - source: "The two-qubit, real-settings, Schmidt-form case of a known stronger bound: Cereceda 2016, eqs. (8)-(9), with Wehner 2006, give P_K <= (1/4)[2(K+1) cos(pi/(2K+2)) - 2K], which is below 1/2, for any state and any +-1 observables (Cereceda's setting is two qubits; neither step uses the dimension); for two qubits and equal settings, Hardy 1997 and Boschi, Branca, De Martini and Hardy 1997: the maximum of the K-step ladder probability is below one half, \"(50 - delta)%\", realised for K -> infinity and a state that is not quite maximally entangled (as quoted by Cereceda 2002 after eq. (19); the bodies of Hardy 1997 and Boschi et al. 1997 were not opened); unequal real settings via Cereceda 2002, eq. (18); no-signalling boxes reach exactly 1/2 (Cereceda 2015); attributed, not new (no prior formal statement found, prover sweep dated 2026-10-28)"
      lean: "HardyLadder.Entry.ladder_prob_lt_half"
      module: "Solution"
      status: "proved"
      note: >-
        Under exactly the hypotheses of statement 1 (c0, c1 > 0,
        c0^2 + c1^2 = 1, angles satisfying the K-step ladder constraints),
        (c0 cos a_K cos b_K + c1 sin a_K sin b_K)^2 < 1/2, for every K.
        Proof: the probability is at most P_K*(q), q = c1/c0 (statement 1);
        for q in (0, 1), 2 q^2 (1 - q^{2K})^2 <= 2 q^2 < 1 + q^2
        <= (1 + q^2)(1 + q^{2K+1})^2, since 0 < q^{2K} <= 1; for q > 1 the
        symmetry P_K*(1/q) = P_K*(q) reduces to q < 1; and P_K*(1) = 0.
        (The all-dimension bound that follows from Cereceda 2016 goes through the
        chained-CHSH Tsirelson bound; that route is not used here.)
    - source: "Hardy 1997 and Boschi et al. 1997, the approach to one half for large K (as quoted by Cereceda 2002 after eq. (19); cf. his introduction: the percentage \"grows from 9 % when only two observables are considered to almost 50%\"); the limit 1/2 as K -> infinity, x -> 1 also in Cereceda 2002, p. 6, Cabello 1998, Sec. 2, and Cereceda 2016, p. 4; attributed to them, not new (no prior formal statement found, prover sweep dated 2026-10-28)"
      lean: "HardyLadder.Entry.ladder_prob_approaches_half"
      module: "Solution"
      status: "proved"
      note: >-
        For every eps > 0 there is K0 : N such that for every K >= K0 there
        are c0, c1 > 0 with c0^2 + c1^2 = 1 and angles satisfying the K-step
        constraints with 1/2 - eps < P(A_K = 1, B_K = 1). With statement 3:
        over all K, Schmidt states and real settings the supremum is 1/2 and
        is not attained. Proof: choose q in (max(0, 1 - eps), 1), so that
        q^2/(1 + q^2) > 1/2 - eps; for fixed q, P_K*(q) -> q^2/(1 + q^2) as
        K -> infinity because (q^2)^K -> 0
        (tendsto_pow_atTop_nhds_zero_of_lt_one); take the state with
        c1/c0 = q and the attaining angles of statement 2. The limit is used
        only in the proof; the statement is written with exists and forall.
    - source: "The derivative of the K-step closed form, whose numerator carries Cereceda 2002's eq. (20) polynomial m_K(x) = x^{4K+3} - (1+2K) x^{2K+3} - 2K x^{2K+2} - 2K x^{2K+1} - (1+2K) x^{2K} + 1 (eq. (20) is introduced with \"It can be shown\", p. 4; the derivative is not printed there); no prior formal statement found (prover sweeps dated 2026-10-28 and 2026-10-29)"
      lean: "HardyLadder.Entry.hasDerivAt_ladder_value"
      module: "Solution"
      status: "proved"
      note: >-
        For every K and q > 0, HasDerivAt of
        x |-> x^2 (1 - x^{2K})^2 / ((1 + x^2)(1 + x^{2K+1})^2) at q with
        derivative 2q (1 - q^{2K}) m_K(q) / ((1 + q^2)^2 (1 + q^{2K+1})^3),
        m_K written out. Proof: hasDerivAt_pow with the product, sum,
        difference, power and quotient rules; q^{2K-1} = q^{2K}/q (K >= 1;
        at K = 0 both sides vanish); the powers q^{2K+1}, q^{2K+2},
        q^{2K+3}, q^{4K+3} rewritten through u = q^{2K}, then field_simp and
        ring. The identity was checked in computer algebra for K = 1, ..., 8
        before formalisation.
    - source: "Cereceda 2002, p. 4 and footnote to eq. (20): the maximisers are the two non-trivial real roots r1 < 1 < r2 = 1/r1 of m_K (\"It can be shown\"), the other roots being -1 (triple) and complex; here: m_K has exactly one zero in (0, 1), for every K >= 1; no prior formal statement found (prover sweeps dated 2026-10-28 and 2026-10-29)"
      lean: "HardyLadder.Entry.existsUnique_mK_root"
      module: "Solution"
      status: "proved"
      note: >-
        For K >= 1 there is exactly one r in (0, 1) with m_K(r) = 0. Proof:
        m_K(x) = 1 - x^{2K} g_K(x) with
        g_K(x) = (1 + 2K) + 2K x + 2K x^2 + (1 + 2K) x^3 - x^{2K+3}; on [0, 1],
        g_K > 0 and g_K' = 2K + 4K x + 3(1 + 2K) x^2 - (2K + 3) x^{2K+2} > 0
        (since x^{2K+2} <= x^2), so x^{2K} g_K(x) is strictly increasing and
        m_K strictly decreasing there (strictMonoOn_of_deriv_pos), from
        m_K(0) = 1 to m_K(1) = -8K; existence by intermediate_value_Ioo'.
