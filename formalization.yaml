    relationship: "independently-proves"
    note: >-
      Scoped to statement 16 (its all-dimension K = 1 optimum contains the
      two-qubit, real-settings bound). Proves that Hardy's two-qubit value (5 sqrt 5 - 11)/2 at K = 1 is the
      supremum over all dimensions, and that any state attaining it is
      equivalent, up to local isometries, to the unique two-qubit state that
      attains it (self-testing). Cited for scope and for the uniqueness of
      the optimal state (statements 15 and 18): the K = 1 value of statements
      12-18 is therefore the all-dimension optimum (statement 16 is a
      special case), while the K = 2 value of statements 20-26 is
      the optimum over two-qubit states and real settings only, and the bound
      1/2 of statements 3-4 is formalised for two-qubit Schmidt states and
      real settings only (its all-dimension strict form follows from
      Cereceda 2016, eq. (9), and Wehner 2006; no-signalling boxes reach 1/2,
      Cereceda 2015); the all-dimension K = 2 optimum is, to our knowledge
      (search dated 2026-10-28), open (Liang, Spekkens and Wiseman 2011 give
      the NPA upper bound 0.17456; Chen, Mal, Tabia and Liang 2024 give
      0.17459 from level 1a of the Moroder et al. hierarchy). No
      dimension-independence is formalised or claimed here.
    license: "unknown"
    author_endorsement: "not-contacted"
