  IntermediateField.adjoin.finrank), Gauss's lemma
  (Polynomial.Monic.irreducible_iff_irreducible_map_fraction_map), the
  reduction criterion Polynomial.Monic.irreducible_of_irreducible_map, and
  the number-field API (NumberField.IsTotallyReal, NumberField.InfinitePlace,
  NumberField.Embeddings.range_eval_eq_rootSet_minpoly,
  IntermediateField.isSimpleOrder_of_finrank_prime,
  Polynomial.card_rootSet_eq_natDegree), the limit API
  (tendsto_pow_atTop_nhds_zero_of_lt_one, Filter.Tendsto.div, lt_mem_nhds),
  and the calculus API (HasDerivAt and its algebra,
  strictMonoOn_of_deriv_pos, strictAntiOn_of_deriv_neg,
  intermediate_value_Ioo');
  thanks to the leanprover community. The closed form is Hardy's (1997) and
  Boschi, Branca, De Martini and Hardy's (1997), restated as eq. (19) and
  shown optimal over unequal settings by Cereceda (2002), who also
  characterised its maximisers as the non-trivial real roots of m_K
  (eq. (20)); the ladder, and
  its approach to one half for large K (the "(50 - delta)%"), are Hardy's
  (1997) and Boschi et al.'s (1997); the bound below one half in every
  dimension follows from Cereceda's eq. (9) (2016) with Wehner's
  chained-CHSH bound (2006);
  and the K = 1 value is Hardy's (1993).
  Developed with AI assistance (Anthropic Claude, in Claude Code) under the
  author's direction.
