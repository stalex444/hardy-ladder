  Built on Mathlib and the Lean 4 toolchain - in particular Real.goldenRatio
  and Real.goldenRatio_sq (NumberTheory/Real/GoldenRatio.lean), the arctan
  API (Real.cos_arctan, Real.sin_arctan, Real.cos_sq_arctan), the minimal
